<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | Tanishka Atri Portfolio</title>
    <meta name="description" content="Get in touch with Tanishka Atri for software development opportunities, project collaborations, or inquiries.">
    <link rel="stylesheet" href="contact.css">
</head>
<body>

    <!-- Header remains consistent across your website -->
    <header role="banner">
        <div class="head">
            <h1 id="main-h">My Portfolio</h1>
            <nav aria-label="Main Navigation">
                <a href="index.html">About</a>
                <a href="project.html">Projects</a>
                <a href="contact.html" aria-current="page">Contact</a>
            </nav>
        </div>
    </header>

    <!-- Main Content wrapper for SEO and Accessibility -->
    <main id="main-content">
        <section class="contact-section" aria-labelledby="contact-heading">
            
            <div class="contact-container">
                <div class="contact-header">
                    <h2 id="contact-heading">Let's <span class="highlight">Talk!</span></h2>
                    <p>Have an exciting project idea, a job opportunity, or just want to say hello? Drop a message below and I will get back to you as soon as possible.</p>
                </div>

                <!-- Accessible, validation-ready Form -->
                <form action="#" method="POST" class="contact-form">
                    
                    <!-- Name Field -->
                    <div class="form-group">
                        <label for="user-name">Full Name <span class="required" aria-hidden="true">*</span></label>
                        <input type="text" id="user-name" name="name" autocomplete="name" required aria-required="true">
                    </div>

                    <!-- Email Field -->
                    <div class="form-group">
                        <label for="user-email">Email Address <span class="required" aria-hidden="true">*</span></label>
                        <input type="email" id="user-email" name="email" autocomplete="email" required aria-required="true">
                    </div>

                    <!-- Subject Field (Optional) -->
                    <div class="form-group">
                        <label for="user-subject">Subject</label>
                        <input type="text" id="user-subject" name="subject">
                    </div>

                    <!-- Message Field -->
                    <div class="form-group">
                        <label for="user-message">Your Message <span class="required" aria-hidden="true">*</span></label>
                        <textarea id="user-message" name="message" rows="6" required aria-required="true"></textarea>
                    </div>

                    <!-- Submit Action -->
                    <div class="form-actions">
                        <button type="submit" class="btn">Send Message</button>
                    </div>

                </form>
            </div>

        </section>
    </main>

</body>
</html>
